<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Gyaz Rush - Матч</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * { user-select: none; -webkit-user-select: none; box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #080a0f; color: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif;
        }

        /* ТАБЛО МАТЧА */
        .hud-header {
            position: absolute; top: 12px; display: flex; align-items: center; gap: 15px;
            background: rgba(10, 14, 23, 0.92); padding: 8px 20px; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15); z-index: 10;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        .team-title { font-weight: 800; font-size: 14px; letter-spacing: 1px; }
        .score-box { 
            background: #000; padding: 4px 12px; border-radius: 6px; 
            font-size: 22px; font-weight: 900; color: #ffcc00; border: 1px solid #333; 
        }
        .timer { font-size: 15px; font-weight: bold; color: #00ff88; min-width: 45px; text-align: center; }
        .half-badge { font-size: 11px; background: rgba(255,255,255,0.1); padding: 3px 8px; border-radius: 4px; color: #aaa; }

        canvas {
            border: 3px solid rgba(255,255,255,0.3); border-radius: 10px;
            box-shadow: 0 0 35px rgba(0,0,0,0.9); background: #1a472a;
            max-width: 98vw; max-height: 82vh;
        }

        .power-bar-container {
            position: absolute; top: 70px; width: 200px; height: 10px;
            background: rgba(0,0,0,0.7); border: 1px solid #fff; border-radius: 5px; overflow: hidden; display: none;
            z-index: 10;
        }
        .power-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00ff88, #ffcc00, #ff0055); }

        #joystick-zone {
            position: absolute; bottom: 25px; left: 30px; width: 130px; height: 130px;
            background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255,255,255,0.25);
            border-radius: 50%; touch-action: none; display: flex; align-items: center; justify-content: center;
            z-index: 10;
        }
        #joystick-stick {
            width: 45px; height: 45px; background: rgba(0, 255, 136, 0.7);
            border: 2px solid #fff; border-radius: 50%; position: absolute; pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .action-buttons {
            position: absolute; bottom: 25px; right: 20px; display: flex; gap: 10px; z-index: 10;
        }
        .btn-act {
            width: 60px; height: 60px; border-radius: 50%; border: 2px solid #fff;
            color: #fff; font-weight: 900; font-size: 10px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); touch-action: manipulation;
        }
        .btn-act:active { transform: scale(0.9); }
        .btn-switch { background: #9b59b6; }
        .btn-pass { background: #00d2ff; }
        .btn-shot { background: #ff0055; }
        .btn-tackle { background: #ffaa00; }
        .btn-act.cooldown { opacity: 0.35; pointer-events: none; filter: grayscale(1); }
        .btn-sub { font-size: 8px; opacity: 0.8; margin-top: 2px; }
    </style>
</head>
<body>

    <div class="hud-header">
        <span class="team-title" style="color:#00a8ff;">FIXONE FC</span>
        <div class="score-box"><span id="home-score">0</span> : <span id="away-score">0</span></div>
        <span class="team-title" style="color:#ff4d4d;" id="bot-team-name">RIVAL</span>
        <div class="timer" id="match-timer">04:00</div>
        <div class="half-badge" id="match-half">1-Й ТАЙМ</div>
    </div>

    <div class="power-bar-container" id="power-bar-container">
        <div class="power-bar-fill" id="power-bar-fill"></div>
    </div>

    <canvas id="pitchCanvas" width="1100" height="650"></canvas>

    <div id="joystick-zone">
        <div id="joystick-stick"></div>
    </div>

    <div class="action-buttons">
        <div class="btn-act btn-switch" id="btn-switch">СМЕНА <span class="btn-sub">(Q)</span></div>
        <div class="btn-act btn-pass" id="btn-pass">ПАС <span class="btn-sub">(K)</span></div>
        <div class="btn-act btn-tackle" id="btn-tackle">ПОДКАТ <span class="btn-sub">(L)</span></div>
        <div class="btn-act btn-shot" id="btn-shot">УДАР <span class="btn-sub">(J)</span></div>
    </div>

    <script type="module" src="match.js"></script>
</body>
</html>
