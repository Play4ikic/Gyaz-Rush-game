<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyaz Rush - Match</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0b0e14; font-family: sans-serif; overflow: hidden; color: #fff; }
        
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        #scoreboard {
            position: absolute; top: 15px; background: rgba(15, 23, 42, 0.9); border: 2px solid #1e293b;
            padding: 8px 20px; border-radius: 12px; display: flex; align-items: center; gap: 15px; font-weight: bold; z-index: 10;
        }
        .score-box { background: #000; padding: 4px 12px; border-radius: 6px; color: #ffcc00; font-size: 20px; }
        
        canvas { background: #174025; border: 4px solid #fff; border-radius: 12px; box-shadow: 0 0 30px rgba(0,0,0,0.8); }

        /* Джойстик */
        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 130px; height: 130px; background: rgba(255,255,255,0.08); border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); touch-action: none; }
        #joystick-stick { position: absolute; top: 35px; left: 35px; width: 60px; height: 60px; background: #00ff88; border-radius: 50%; box-shadow: 0 0 15px #00ff88; pointer-events: none; }

        /* Полоса силы */
        #power-bar-container { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 200px; height: 14px; background: #222; border-radius: 7px; border: 2px solid #fff; overflow: hidden; display: none; }
        #power-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00ff88, #ffcc00, #ff0055); }

        /* Блок управления в стиле FIFA Mobile (NumPad схема) */
        #controls-right { position: absolute; bottom: 30px; right: 40px; width: 220px; height: 220px; }
        .fifa-cluster { position: relative; width: 100%; height: 100%; }
        
        .fifa-btn {
            position: absolute; border-radius: 50%; background: radial-gradient(circle, #2a323d 0%, #11161d 100%);
            color: #fff; font-weight: 900; text-align: center; cursor: pointer; display: flex; flex-direction: column;
            align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: transform 0.05s;
        }
        .fifa-btn:active { transform: scale(0.9); }
        .fifa-btn span { font-size: 10px; opacity: 0.7; }

        .btn-8 { width: 65px; height: 65px; top: 0; left: 77.5px; border: 3px solid #ff4400; color: #ff4400; }
        .btn-4 { width: 65px; height: 65px; top: 77.5px; left: 0; border: 3px solid #00aaff; color: #00aaff; }
        .btn-6 { width: 65px; height: 65px; top: 77.5px; right: 0; border: 3px solid #ffaa00; color: #ffaa00; }
        .btn-2 { width: 65px; height: 65px; bottom: 0; left: 77.5px; border: 3px solid #ff0055; color: #ff0055; }
        .btn-5 { width: 75px; height: 75px; top: 72.5px; left: 72.5px; border: 4px solid #00ff88; color: #00ff88; box-shadow: 0 0 15px rgba(0,255,136,0.4); z-index: 2; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="scoreboard">
            <span id="home-team-name" style="color:#00d2ff">ВЫ</span>
            <div class="score-box"><span id="home-score">0</span> : <span id="away-score">0</span></div>
            <span id="bot-team-name" style="color:#ff3366">RIVAL</span>
            <span id="match-timer" style="color:#00ff88; margin-left:10px;">04:00</span>
            <span id="match-half" style="font-size:12px; color:#aaa;">1-Й ТАЙМ</span>
        </div>

        <canvas id="pitchCanvas" width="1100" height="650"></canvas>

        <div id="joystick-zone"><div id="joystick-stick"></div></div>
        <div id="power-bar-container"><div id="power-bar-fill"></div></div>

        <div id="controls-right">
            <div class="fifa-cluster">
                <button id="btn-shoot" class="fifa-btn btn-8">SHOOT<br><span>(8)</span></button>
                <button id="btn-pass" class="fifa-btn btn-4">PASS<br><span>(4)</span></button>
                <button id="btn-skill" class="fifa-btn btn-5">SKILL<br><span>(5)</span></button>
                <button id="btn-through" class="fifa-btn btn-6">THROUGH<br><span>(6)</span></button>
                <button id="btn-tackle" class="fifa-btn btn-2">TACKLE<br><span>(2)</span></button>
            </div>
        </div>
    </div>
    <script src="match.js"></script>
</body>
</html>
