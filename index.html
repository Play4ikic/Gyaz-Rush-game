<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FixOne FC - Hub</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <style>
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 100;
        }

        .business-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.3);
            padding: 5px 15px;
            border-radius: 12px;
            cursor: pointer;
            min-width: 120px;
            margin-right: 15px;
        }

        .business-label { font-size: 10px; color: #aaa; text-transform: uppercase; }
        .business-money { color: #00ff88; font-weight: bold; font-family: monospace; }

        /* УВЕЛИЧЕННЫЙ ВИДЖЕТ PASS (Левый нижний угол) */
        .pass-widget {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 300px;
            z-index: 99999;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .pass-widget:hover { transform: scale(1.05); }
        .pass-widget:active { transform: scale(0.95); }

        .pass-card {
            background: linear-gradient(180deg, #f1c40f 0%, #d4ac0d 100%);
            border: 5px solid #000;
            border-radius: 18px;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            box-shadow: 0 8px 0 #856404;
        }

        .pass-season-label {
            font-family: 'Arial Black', sans-serif;
            color: #000;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            margin-left: 5px;
        }

        .pass-main-row {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .pass-ticket-icon { 
            width: 55px; 
            filter: drop-shadow(3px 3px 0 #000); 
        }

        .pass-xp-container {
            flex-grow: 1;
            background: #664400;
            border-radius: 10px;
            height: 28px;
            position: relative;
            border: 3px solid #000;
            overflow: hidden;
        }

        .pass-xp-fill {
            height: 100%;
            width: 0%;
            background: #0099ff;
            transition: width 0.5s;
        }

        .pass-xp-text {
            position: absolute;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 14px;
            font-weight: 900;
            text-shadow: 2px 2px 0 #000;
            line-height: 22px;
            z-index: 2;
        }

        /* ВИДЖЕТ ПРОМОКОДОВ (Справа от Пасса) */
        .promo-widget {
            position: fixed;
            bottom: 30px;
            left: 350px;
            width: 300px;
            z-index: 99999;
        }

        .promo-card {
            background: rgba(18, 18, 22, 0.95);
            border: 2px solid #ffcc00;
            border-radius: 18px;
            padding: 12px 15px;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
            backdrop-filter: blur(12px);
        }

        .promo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .promo-title {
            font-family: 'Arial Black', sans-serif;
            color: #ffcc00;
            font-size: 13px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .promo-subtitle {
            font-size: 10px;
            color: #aaa;
            margin-bottom: 8px;
        }

        .promo-input-group {
            display: flex;
            gap: 6px;
        }

        .promo-input-group input {
            flex-grow: 1;
            background: #000;
            border: 1px solid rgba(255, 204, 0, 0.4);
            border-radius: 8px;
            padding: 6px 10px;
            color: #fff;
            font-weight: bold;
            font-size: 12px;
            outline: none;
            text-transform: uppercase;
        }

        .promo-input-group input:focus {
            border-color: #ffcc00;
        }

        .promo-btn {
            background: #ffcc00;
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-weight: 900;
            font-size: 11px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .promo-btn:hover {
            background: #e6b800;
            transform: scale(1.03);
        }

        .promo-btn:active {
            transform: scale(0.95);
        }

        .promo-message {
            font-size: 11px;
            margin-top: 6px;
            font-weight: bold;
            min-height: 14px;
        }

        /* МОДАЛКА ЛЮДИ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100000;
        }

        /* ПАНЕЛЬ ОНЛАЙН-ЧАТА (МЕССЕНДЖЕР) */
        .chat-widget {
            position: fixed;
            bottom: 70px;
            right: 20px;
            width: 320px;
            background: rgba(16, 20, 30, 0.95);
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 212, 255, 0.2);
            backdrop-filter: blur(15px);
            z-index: 99998;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.25s ease-in-out;
        }

        .chat-widget.collapsed {
            width: 200px;
        }

        /* Гарантированное скрытие содержимого при сворачивании */
        .chat-widget.collapsed .chat-body {
            display: none !important;
        }

        .chat-header {
            background: linear-gradient(90deg, #0055ff, #00d2ff);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .chat-header-title {
            font-family: 'Arial Black', sans-serif;
            font-size: 13px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
        }

        .online-status-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
        }

        .chat-toggle-btn {
            background: none;
            border: none;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-body {
            display: flex;
            flex-direction: column;
            height: 350px;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(5, 8, 15, 0.6);
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.4);
            border-radius: 4px;
        }

        .chat-msg {
            display: flex;
            flex-direction: column;
            max-width: 82%;
            animation: msgPop 0.2s ease-out forwards;
        }

        @keyframes msgPop {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .chat-msg.my-msg {
            align-self: flex-end;
        }

        .chat-msg.other-msg {
            align-self: flex-start;
        }

        .msg-sender {
            font-size: 10px;
            font-weight: bold;
            color: #00d2ff;
            margin-bottom: 2px;
            margin-left: 4px;
        }

        .chat-msg.my-msg .msg-sender {
            display: none;
        }

        .msg-bubble {
            padding: 8px 12px;
            border-radius: 14px;
            font-size: 12px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }

        .chat-msg.my-msg .msg-bubble {
            background: linear-gradient(135deg, #0088cc, #0055ff);
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .chat-msg.other-msg .msg-bubble {
            background: rgba(255, 255, 255, 0.1);
            color: #eee;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 2px;
        }

        .msg-time {
            font-size: 8px;
            color: rgba(255, 255, 255, 0.6);
            align-self: flex-end;
            margin-top: 2px;
            margin-left: 6px;
            float: right;
        }

        .chat-input-area {
            display: flex;
            gap: 6px;
            padding: 10px;
            background: rgba(10, 14, 22, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .chat-input-area input {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 8px 12px;
            color: white;
            font-size: 12px;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: #00d2ff;
        }

        .chat-send-btn {
            background: #00d2ff;
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 0 14px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .chat-send-btn:hover {
            background: #00ff88;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <header class="top-nav">
        <div class="logo" style="font-weight: 900; color: #fff; letter-spacing: 2px;">GYAZ RUSH</div>
        
        <nav class="menu-tabs">
            <div class="tab-item active" onclick="selectTab('news')">НОВОСТИ</div>
            <div class="tab-item" onclick="selectTab('shop')">МАГАЗИН</div>
            <div class="tab-item" onclick="selectTab('club')">КЛУБ</div>
            <div class="tab-item" onclick="selectTab('draft')">DRAFT</div>
            <div class="tab-item" onclick="selectTab('market')">РЫНОК</div>
            <div class="tab-item" onclick="selectTab('betting')">СТАВКИ</div>
            <div class="tab-item" onclick="window.location.href='trade.html'" style="color: #00ff88; font-weight: bold;">ТРЕЙДЫ</div>
            <div class="tab-item" onclick="toggleChat()" style="color: #00d2ff; font-weight: bold; cursor: pointer;">ЧАТ</div>
            <div class="tab-item" onclick="openOnline()" style="color: #e1b12c; font-weight: bold;">ЛЮДИ</div>
        </nav>

        <div class="right-side" style="display: flex; align-items: center;">
            <div class="business-container" onclick="collectBusinessMoney()">
                <span class="business-label">Бизнес</span>
                <span id="business-display" class="business-money">0 / 6000 CY</span>
            </div>
            <div id="shop-balance" style="background: #00ff88; color: #000; padding: 8px 15px; border-radius: 8px; font-weight: bold;">
                0 CY
            </div>
        </div>
    </header>

    <!-- ВИДЖЕТ PASS (Слева) -->
    <div class="pass-widget" onclick="window.location.href='gympass.html'">
        <div class="pass-card">
            <div class="pass-season-label">SPRING SEASON</div>
            <div class="pass-main-row">
                <img src="images/pass_ticket.png" class="pass-ticket-icon" alt="Pass">
                <div class="pass-xp-container">
                    <div class="pass-xp-text" id="widget-xp-text">0 / 1000</div>
                    <div class="pass-xp-fill" id="widget-xp-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ВИДЖЕТ ПРОМОКОДОВ (Справа от Пасса) -->
    <div class="promo-widget">
        <div class="promo-card">
            <div class="promo-header">
                <span class="promo-title">🎁 ПРОМОКОДЫ</span>
            </div>
            <div class="promo-subtitle">Введи секретный код и получи бонусные CY!</div>
            <div class="promo-input-group">
                <input type="text" id="promo-input" placeholder="КОД..." maxlength="20">
                <button class="promo-btn" onclick="activatePromoCode()">ОК</button>
            </div>
            <div id="promo-msg" class="promo-message"></div>
        </div>
    </div>

    <!-- ВИДЖЕТ ЧАТА МЕЖДУ ИГРОКАМИ -->
    <div id="chat-widget" class="chat-widget collapsed">
        <div class="chat-header" onclick="toggleChat()">
            <div class="chat-header-title">
                <span class="online-status-dot"></span>
                <span>ЧАТ ИГРОКОВ</span>
            </div>
            <button class="chat-toggle-btn" id="chat-toggle-icon">▲</button>
        </div>
        <div class="chat-body">
            <div class="chat-messages" id="chat-messages-list">
                <!-- Сообщения подгружаются в реальном времени из Firebase -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Напиши сообщение..." maxlength="120" onkeydown="if(event.key==='Enter') sendChatMessage()">
                <button class="chat-send-btn" onclick="sendChatMessage()">➤</button>
            </div>
        </div>
    </div>

    <main class="content-preview">
        <div id="preview-box" class="preview-container">
            <div class="info-side">
                <h2 id="pre-title">НОВОСТИ</h2>
                <p id="pre-desc">Загрузка последних событий...</p>
                <a href="#" id="pre-link" class="go-btn">ПЕРЕЙТИ В РЕЖИМ →</a>
            </div>
            <div class="image-side">
                <img src="Prewie/news.png" id="pre-img" alt="Preview">
            </div>
        </div>
    </main>

    <div id="online-modal" class="modal-overlay" onclick="closeOnline()">
        <div class="modal-content" onclick="event.stopPropagation()" style="width: 90%; max-width: 500px; background: #111; border-radius: 20px;">
            <iframe src="online.html" style="width: 100%; height: 500px; border: none;"></iframe>
        </div>
    </div>

    <!-- ГЛОБАЛЬНОЕ УПРАВЛЕНИЕ ОКНОМ ЧАТА (Открывается мгновенно) -->
    <script>
        function toggleChat() {
            const chat = document.getElementById('chat-widget');
            const icon = document.getElementById('chat-toggle-icon');
            if (!chat) return;

            chat.classList.toggle('collapsed');
            
            if (icon) {
                icon.innerText = chat.classList.contains('collapsed') ? '▲' : '▼';
            }
            
            const container = document.getElementById('chat-messages-list');
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
        }
        window.toggleChat = toggleChat;
    </script>

    <script src="script.js"></script>
    <script>
        function updateWidgetXP() {
            const xp = parseInt(localStorage.getItem('playerXP')) || 0;
            const xpPerLevel = 1000;
            const currentXP = xp % xpPerLevel;
            const percent = (currentXP / xpPerLevel) * 100;
            
            const fill = document.getElementById('widget-xp-fill');
            const text = document.getElementById('widget-xp-text');
            
            if(fill) fill.style.width = percent + "%";
            if(text) text.innerText = `${currentXP} / ${xpPerLevel}`;
        }

        function updateHubBalance() {
            const balance = localStorage.getItem('fixone_balance') || "0";
            const display = document.getElementById('shop-balance');
            if(display) display.innerText = parseInt(balance).toLocaleString() + " CY";
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateWidgetXP();
            updateHubBalance();
        });

        function openOnline() { document.getElementById('online-modal').style.display = 'flex'; }
        function closeOnline() { document.getElementById('online-modal').style.display = 'none'; }
    </script>

    <div class="audio-controls" style="position: fixed; bottom: 10px; right: 10px; z-index: 9999; display: flex; gap: 10px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 15px;">
        <button onclick="this.innerText = (typeof toggleMute === 'function' && toggleMute()) ? '🔇' : '🎵'" style="background: none; border: none; font-size: 20px; cursor: pointer;">🎵</button>
        <input type="range" min="0" max="1" step="0.1" value="0.3" oninput="if(typeof setVolume === 'function') setVolume(this.value)" style="width: 60px; cursor: pointer;">
    </div>

    <script src="audio.js"></script>
    
    <!-- ПОДКЛЮЧЕНИЕ Firebase И ОНЛАЙН-ЧАТА -->
    <script type="module" src="online.js"></script>

    <script type="module">
        import { updateBalance } from './economy.js';

        const BIZ_CONFIG = {
            MAX: 6000,
            PER_SECOND: 20,
            VAL_KEY: 'gyaz_biz_val',
            TIME_KEY: 'gyaz_biz_time'
        };

        let currentPool = parseFloat(localStorage.getItem(BIZ_CONFIG.VAL_KEY)) || 0;
        let lastTick = parseInt(localStorage.getItem(BIZ_CONFIG.TIME_KEY)) || Date.now();

        function tick() {
            const now = Date.now();
            const diffMs = now - lastTick;

            if (diffMs >= 1000) {
                const secondsPassed = Math.floor(diffMs / 1000);
                
                if (currentPool < BIZ_CONFIG.MAX) {
                    currentPool += secondsPassed * BIZ_CONFIG.PER_SECOND;
                    if (currentPool > BIZ_CONFIG.MAX) currentPool = BIZ_CONFIG.MAX;
                    
                    lastTick += secondsPassed * 1000;
                    localStorage.setItem(BIZ_CONFIG.VAL_KEY, currentPool);
                    localStorage.setItem(BIZ_CONFIG.TIME_KEY, lastTick);
                }
            }

            const display = document.getElementById('business-display');
            if (display) {
                display.innerText = Math.floor(currentPool).toLocaleString() + " / " + BIZ_CONFIG.MAX + " CY";
                display.style.color = (currentPool >= BIZ_CONFIG.MAX) ? "#ff4444" : "#00ff88";
            }
        }

        window.collectBusinessMoney = async function() {
            if (currentPool >= 1) {
                const toAdd = Math.floor(currentPool);
                const success = await updateBalance(toAdd);

                if (success) {
                    currentPool = 0;
                    lastTick = Date.now();
                    localStorage.setItem(BIZ_CONFIG.VAL_KEY, 0);
                    localStorage.setItem(BIZ_CONFIG.TIME_KEY, lastTick);
                    if (typeof updateHubBalance === 'function') updateHubBalance();
                }
            }
        };

        const PROMO_CODES = {
            'PIDORAS': 100000
        };

        window.activatePromoCode = async function() {
            const input = document.getElementById('promo-input');
            const msg = document.getElementById('promo-msg');
            if (!input || !msg) return;

            const code = input.value.trim().toUpperCase();
            if (!code) {
                msg.style.color = '#ff4444';
                msg.innerText = 'Введите код!';
                return;
            }

            let usedPromos = JSON.parse(localStorage.getItem('gyaz_used_promos')) || [];

            if (usedPromos.includes(code)) {
                msg.style.color = '#ff4444';
                msg.innerText = 'Код уже активирован!';
                return;
            }

            if (PROMO_CODES[code]) {
                const reward = PROMO_CODES[code];
                let success = await updateBalance(reward);

                if (success) {
                    usedPromos.push(code);
                    localStorage.setItem('gyaz_used_promos', JSON.stringify(usedPromos));
                    
                    msg.style.color = '#00ff88';
                    msg.innerText = `+${reward.toLocaleString()} CY зачислено!`;
                    input.value = '';
                    
                    if (typeof updateHubBalance === 'function') updateHubBalance();
                } else {
                    msg.style.color = '#ff4444';
                    msg.innerText = 'Ошибка зачисления!';
                }
            } else {
                msg.style.color = '#ff4444';
                msg.innerText = 'Неверный промокод!';
            }
        };

        setInterval(tick, 1000);
        tick();
    </script>
</body>
</html>
