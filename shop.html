<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixOne Shop - Special Packs</title>
    <link rel="stylesheet" href="shop.css">
    <script type="module" src="economy.js"></script>
    <script type="module" src="shop.js"></script>
</head>
<body>
    <div class="shop-wrapper">
        <header class="shop-header">
            <a href="index.html" class="back-btn">← В МЕНЮ</a>
            <h1 class="shop-title">Goalyaz SHOP</h1>
            <div id="shop-balance" class="balance-board">Загрузка...</div>
        </header>

        <main class="shop-content">
            <div class="pack-container">
                
                <!-- GOLD PACK -->
                <div class="pack-card gold-card">
                    <div class="pack-visual">
                        <img src="images/gold.png" alt="Gold" class="pack-img">
                    </div>
                    <div class="pack-details">
                        <h2>GOLD PACK</h2>
                        <div class="pack-price">1,000 CY</div>
                    </div>
                    <button class="buy-button" onclick="openPack('gold', '')">ОТКРЫТЬ</button>
                </div>


                <!-- TOTT PACK -->
                <div class="pack-card tott-card">
                    <div class="pack-visual">
                        <img src="images/TOTT.png" alt="TOTT PACK" class="pack-img">
                    </div>
                    <div class="pack-details">
                        <h2>TOTT PACK</h2>
                        <div class="pack-price">50,000 CY</div>
                    </div>
                    <button class="buy-button" onclick="openPack('tott', 'анимация.mp4')">ОТКРЫТЬ</button>
                </div>
    <!-- CHAMPIONS PACK -->
                <div class="pack-card champions-card">
                    <div class="pack-visual">
                        <img src="images/champions league.jpg" alt="UCL" class="pack-img">
                    </div>
                    <div class="pack-details">
                        <h2>CHAMPIONS PACK</h2>
                        <div class="pack-price">70,000 CY</div>
                    </div>
                    <button class="buy-button" onclick="openPack('champions', 'анимация 2.mp4')">ОТКРЫТЬ</button>
                </div>
                <!-- NATIONAL STARS PACK -->
                <div class="pack-card national-stars-card">
                    <div class="pack-visual">
                        <img src="images/NationalPack.png" alt="NATIONAL STARS" class="pack-img">
                    </div>
                    <div class="pack-details">
                        <h2>NATIONAL STARS</h2>
                        <div class="pack-price">80,000 CY</div>
                    </div>
                    <button class="buy-button" onclick="openPack('national_stars', 'анимация 2.mp4')">ОТКРЫТЬ</button>
                </div>

                <!-- TIME TRAVELS PACK -->
                <div class="pack-card time-travels-card">
                    <div class="pack-visual">
                        <img src="images/TimePack.png" alt="TIME TRAVELS" class="pack-img">
                    </div>
                    <div class="pack-details">
                        <h2>TIME TRAVELS</h2>
                        <div class="pack-price">100,000 CY</div>
                    </div>
                    <button class="buy-button" onclick="openPack('time_travels', 'анимация 2.mp4')">ОТКРЫТЬ</button>
                </div>

                <!-- TOTY PACK -->
                <div class="pack-card toty-card">
                    <div class="pack-visual">
                        <img src="images/toty.jpg" alt="TOTY" class="pack-img">
                    </div>
                    <div class="pack-details">
                        <h2>TOTY PACK</h2>
                        <div class="pack-price">200,000 CY</div>
                    </div>
                    <button class="buy-button" onclick="openPack('toty', 'анимация.mp4')">ОТКРЫТЬ</button>
                </div>

                <!-- CHAOS PACK -->
                <div class="pack-card chaos-card">
                    <div class="pack-tag">ULTIMATE 99</div>
                    <div class="pack-visual">
                        <img src="images/CHAOSPACK.png" alt="CHAOS PACK" class="pack-img">
                    </div>
                    <div class="pack-details">
                        <h2>CHAOS PACK</h2>
                        <div class="pack-price">800,000 CY</div>
                    </div>
                    <button class="buy-button" onclick="openPack('chaos', 'анимация 2.mp4')">ОТКРЫТЬ</button>
                </div>

            </div>
        </main>
    </div>

    <!-- ОКНО АНИМАЦИИ ОТКРЫТИЯ -->
    <div id="video-reveal-container" class="hidden">
        <video id="pack-video" playsinline preload="auto">
            <source src="" type="video/mp4">
        </video>
        <div id="video-overlay" class="hidden">
            <div id="reveal-country-cont" class="reveal-text">
                <img src="images/Flag.jpg" class="flag-reveal-icon">
            </div> 
            <div id="reveal-pos" class="reveal-text">ST</div>
            <div id="reveal-club-img-cont" class="reveal-text">
                <img src="" id="reveal-club-icon" class="club-reveal-icon">
            </div>
        </div>
    </div>

    <!-- ОКНО ВЫПАВШЕЙ КАРТОЧКИ -->
    <div id="reveal-screen" class="hidden">
        <div class="overlay"></div>
        <div class="reveal-container">
            <img src="" id="card-res-img" class="final-player-image">
            <button class="claim-button">ЗАБРАТЬ В СОСТАВ</button>
        </div>
    </div>

    <div class="audio-controls" style="position: fixed; bottom: 15px; right: 15px; z-index: 9999; display: flex; gap: 10px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 15px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);">
        <button onclick="this.innerText = (typeof toggleMute === 'function' && toggleMute()) ? '🔇' : '🎵'" style="background: none; border: none; font-size: 20px; cursor: pointer; color: white;">🎵</button>
        <input type="range" min="0" max="1" step="0.1" value="0.3" oninput="if(typeof setVolume === 'function') setVolume(this.value)" style="width: 60px; cursor: pointer;">
    </div>

    <script src="audio.js"></script>
</body>
</html>
