<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GYaz Rush - Professional Squad</title>
    <link rel="stylesheet" href="club.css">
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <div class="main-background" style="background-image: url('images/baground.jpg');"></div>

    <header class="squad-header">
        <div class="left-meta">
            <a href="index.html" class="back-link">← HUB</a>
            <div class="team-info">
                <div class="rating-stars">RATING: <span id="avg-rating">0</span></div>
            </div>
        </div>
        <div class="right-meta">
            <button class="reset-pos-btn" onclick="resetSlotPositions()">СБРОСИТЬ СХЕМУ</button>
        </div>
    </header>

    <main class="pitch-container" id="pitch-area">
        <div class="football-pitch" id="football-pitch">
            <!-- ВРАТАРЬ (ЗАФИКСИРОВАН) -->
            <div class="player-slot locked-slot" id="slot-0" onclick="handleSlotClick(0)">
                <div class="slot-label">GK</div>
            </div>

            <!-- ПОЛЕВЫЕ ИГРОКИ (СВОБОДНОЕ ПЕРЕТАСКИВАНИЕ) -->
            <div class="player-slot draggable-slot" id="slot-1" onclick="handleSlotClick(1)">
                <div class="slot-label">FLD</div>
            </div>
            <div class="player-slot draggable-slot" id="slot-2" onclick="handleSlotClick(2)">
                <div class="slot-label">FLD</div>
            </div>
            <div class="player-slot draggable-slot" id="slot-3" onclick="handleSlotClick(3)">
                <div class="slot-label">FLD</div>
            </div>
            <div class="player-slot draggable-slot" id="slot-4" onclick="handleSlotClick(4)">
                <div class="slot-label">FLD</div>
            </div>
        </div>
    </main>

    <button class="toggle-inventory-btn" onclick="toggleInventory()">⬇ СКРЫТЬ КЛУБ</button>

    <footer class="inventory-footer" id="inventory-panel">
        <div class="inventory-header">
            <span>MY CLUB PLAYERS</span>
            <button class="clear-btn" onclick="clearSquad()">ОЧИСТИТЬ ВСЕ</button>
        </div>
        <div id="club-inventory" class="inventory-scroll"></div>
    </footer>

    <div class="audio-controls">
        <button onclick="this.innerText = (typeof toggleMute === 'function' && toggleMute()) ? '🔇' : '🎵'">🎵</button>
        <input type="range" min="0" max="1" step="0.1" value="0.3" oninput="if(typeof setVolume === 'function') setVolume(this.value)">
    </div>

    <!-- ВИДЖЕТ ЧАТА -->
    <div id="chat-widget" class="chat-widget collapsed">
        <div class="chat-header">
            <div class="chat-header-title" id="chat-header-btn">
                <span class="online-status-dot"></span>
                <span>ЧАТ ИГРОКОВ</span>
            </div>
            <div class="chat-controls">
                <button class="chat-control-btn" id="chat-size-btn" title="Увеличить размер">⤢</button>
                <button class="chat-control-btn" id="chat-toggle-icon" title="Свернуть/Развернуть">▲</button>
            </div>
        </div>
        <div class="chat-body">
            <div class="chat-messages" id="chat-messages-list"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Напиши сообщение..." maxlength="120">
                <button class="chat-send-btn" id="chat-send-btn">➤</button>
            </div>
        </div>
    </div>

    <script type="module" src="club.js"></script>
    <script src="audio.js"></script>
    <script type="module" src="online.js"></script>
</body>
</html>
